<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180">
  <rect width="700" height="180" fill="white"/>

  <!-- bit index labels -->
  <text x="50"  y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">15</text>
  <text x="90"  y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">14</text>
  <text x="130" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">13</text>
  <text x="170" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">12</text>
  <text x="210" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">11</text>
  <text x="250" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">10</text>
  <text x="290" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">9</text>
  <text x="330" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">8</text>
  <text x="370" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">7</text>
  <text x="410" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">6</text>
  <text x="450" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">5</text>
  <text x="490" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">4</text>
  <text x="530" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">3</text>
  <text x="570" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">2</text>
  <text x="610" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">1</text>
  <text x="650" y="28" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">0</text>

  <!-- field fills -->
  <rect x="30"  y="36" width="400" height="40" fill="#ffd6d6"/>
  <rect x="430" y="36" width="240" height="40" fill="#d4f5dc"/>

  <!-- diagonal hatch — ID cells (bits 15..6) -->
  <line x1="30"  y1="76" x2="70"  y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="70"  y1="76" x2="110" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="110" y1="76" x2="150" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="150" y1="76" x2="190" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="190" y1="76" x2="230" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="230" y1="76" x2="270" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="270" y1="76" x2="310" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="310" y1="76" x2="350" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="350" y1="76" x2="390" y2="36" stroke="#f0a0a0" stroke-width="1"/>
  <line x1="390" y1="76" x2="430" y2="36" stroke="#f0a0a0" stroke-width="1"/>

  <!-- diagonal hatch — Distance cells (bits 5..0) -->
  <line x1="430" y1="76" x2="470" y2="36" stroke="#90d8a0" stroke-width="1"/>
  <line x1="470" y1="76" x2="510" y2="36" stroke="#90d8a0" stroke-width="1"/>
  <line x1="510" y1="76" x2="550" y2="36" stroke="#90d8a0" stroke-width="1"/>
  <line x1="550" y1="76" x2="590" y2="36" stroke="#90d8a0" stroke-width="1"/>
  <line x1="590" y1="76" x2="630" y2="36" stroke="#90d8a0" stroke-width="1"/>
  <line x1="630" y1="76" x2="670" y2="36" stroke="#90d8a0" stroke-width="1"/>

  <!-- cell labels — ID -->
  <text x="50"  y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="90"  y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="130" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="170" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="210" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="250" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="290" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="330" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="370" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>
  <text x="410" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#7a1c1c">ID</text>

  <!-- cell labels — Distance -->
  <text x="450" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#1a5c2a">D</text>
  <text x="490" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#1a5c2a">D</text>
  <text x="530" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#1a5c2a">D</text>
  <text x="570" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#1a5c2a">D</text>
  <text x="610" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#1a5c2a">D</text>
  <text x="650" y="62" text-anchor="middle" font-size="10" font-weight="bold" font-family="monospace" fill="#1a5c2a">D</text>

  <!-- outer border -->
  <rect x="30" y="36" width="640" height="40" fill="none" stroke="#444" stroke-width="2"/>

  <!-- internal dividers -->
  <line x1="70"  y1="36" x2="70"  y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="36" x2="110" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="150" y1="36" x2="150" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="190" y1="36" x2="190" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="230" y1="36" x2="230" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="270" y1="36" x2="270" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="310" y1="36" x2="310" y2="76" stroke="#aaa" stroke-width="1"/>
  <!-- byte boundary between bit 8 and bit 7 -->
  <line x1="350" y1="30" x2="350" y2="76" stroke="#444" stroke-width="2.5"/>
  <text x="350" y="27" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#888">byte</text>
  <line x1="390" y1="36" x2="390" y2="76" stroke="#aaa" stroke-width="1"/>
  <!-- field boundary between ID and Distance -->
  <line x1="430" y1="36" x2="430" y2="76" stroke="#777" stroke-width="2"/>
  <line x1="470" y1="36" x2="470" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="510" y1="36" x2="510" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="550" y1="36" x2="550" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="590" y1="36" x2="590" y2="76" stroke="#aaa" stroke-width="1"/>
  <line x1="630" y1="36" x2="630" y2="76" stroke="#aaa" stroke-width="1"/>

  <!-- span brackets -->
  <path d="M 30,84 L 30,90 L 430,90 L 430,84" fill="none" stroke="#c0504d" stroke-width="1.5"/>
  <text x="230" y="103" text-anchor="middle" font-size="11" font-family="sans-serif" font-weight="600" fill="#7a1c1c">bits [15:6] — 10-bit Identifier (0..1023)</text>
  <path d="M 430,84 L 430,90 L 670,90 L 670,84" fill="none" stroke="#4caf50" stroke-width="1.5"/>
  <text x="550" y="103" text-anchor="middle" font-size="11" font-family="sans-serif" font-weight="600" fill="#1a5c2a">bits [5:0] — Distance cm (0..63)</text>

  <!-- legend -->
  <rect x="30" y="118" width="16" height="16" fill="#ffd6d6" stroke="#c0504d" stroke-width="1.5" rx="2"/>
  <line x1="30" y1="134" x2="46" y2="118" stroke="#f0a0a0" stroke-width="1"/>
  <text x="53" y="131" font-size="11" font-family="sans-serif" fill="#333"><tspan font-weight="700">ID</tspan> — Node identifier · 10-bit · 1024 max</text>
  
  <rect x="340" y="118" width="16" height="16" fill="#d4f5dc" stroke="#4caf50" stroke-width="1.5" rx="2"/>
  <line x1="340" y1="134" x2="356" y2="118" stroke="#90d8a0" stroke-width="1"/>
  <text x="363" y="131" font-size="11" font-family="sans-serif" fill="#333"><tspan font-weight="700">D</tspan> — Distance (cm) · 6-bit · saturated 0..63</text>

  <!-- footer note -->
  <text x="350" y="160" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#999">little-endian · low byte first · ‖ marks byte boundary</text>
</svg>
